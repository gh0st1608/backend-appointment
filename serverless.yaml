org: ghost1608
app: appointment-backend
service: appointment-backend

frameworkVersion: '4'
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:REGION, "us-east-1"}

  environment:

    # AWS region
    REGION: ${env:REGION, "us-east-1"}

    # DynamoDB (creado por CloudFormation)
    APPOINTMENT_DYNAMODB: appointment-table-${sls:stage}

    # EventBridge Bus Name (viene del .env o SSM)
    APPOINTMENT_EVENT_BUS: ${env:APPOINTMENT_EVENT_BUS, ssm:/appointment-backend/eventbus/name}

    # SNS Topic ARN
    APPOINTMENT_CREATED_TOPIC_ARN: 
      Ref: AppointmentCreatedTopic

    # RDS PE
    RDS_HOST_PE: ${env:RDS_HOST_PE, ssm:/appointment-backend/rds/host_pe}
    RDS_PORT_PE: ${env:RDS_PORT_PE, ssm:/appointment-backend/rds/port_pe}
    RDS_USER_PE: ${env:RDS_USER_PE, ssm:/appointment-backend/rds/user_pe}
    RDS_PASSWORD_PE: ${env:RDS_PASSWORD_PE, ssm:/appointment-backend/rds/password_pe~true}
    RDS_DATABASE_PE: ${env:RDS_DATABASE_PE, ssm:/appointment-backend/rds/database_pe}

    # RDS CL
    RDS_HOST_CL: ${env:RDS_HOST_CL, ssm:/appointment-backend/rds/host_cl}
    RDS_PORT_CL: ${env:RDS_PORT_CL, ssm:/appointment-backend/rds/port_cl}
    RDS_USER_CL: ${env:RDS_USER_CL, ssm:/appointment-backend/rds/user_cl}
    RDS_PASSWORD_CL: ${env:RDS_PASSWORD_CL, ssm:/appointment-backend/rds/password_cl~true}
    RDS_DATABASE_CL: ${env:RDS_DATABASE_CL, ssm:/appointment-backend/rds/database_cl}

functions:

  appointmentApi:
    handler: dist/infrastructure/lambdas/appointment.handler
    events:
      - httpApi:
          path: /appointments
          method: post

    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          Fn::GetAtt: [AppointmentTable, Arn]

      - Effect: Allow
        Action:
          - sns:Publish
        Resource:
          Ref: AppointmentCreatedTopic

  appointmentPeConsumer:
    handler: dist/infrastructure/lambdas/appointment_pe.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt: [SqsPEQueue, Arn]

    iamRoleStatements:
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          Fn::GetAtt: [SqsPEQueue, Arn]

      - Effect: Allow
        Action:
          - events:PutEvents
        Resource:
          arn:aws:events:${env:REGION}:*:event-bus/${env:APPOINTMENT_EVENT_BUS}

      - Effect: Allow
        Action:
          - rds-db:connect
        Resource: "*"

  appointmentClConsumer:
    handler: dist/infrastructure/lambdas/appointment_cl.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt: [SqsCLQueue, Arn]

    iamRoleStatements:
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          Fn::GetAtt: [SqsCLQueue, Arn]

      - Effect: Allow
        Action:
          - events:PutEvents
        Resource:
          arn:aws:events:${env:REGION}:*:event-bus/${env:APPOINTMENT_EVENT_BUS}

      - Effect: Allow
        Action:
          - rds-db:connect
        Resource: "*"


resources:
  Resources:

    AppointmentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: appointment-table-${sls:stage}
        AttributeDefinitions:
          - AttributeName: insuredId
            AttributeType: S
          - AttributeName: scheduleId
            AttributeType: N
        KeySchema:
          - AttributeName: insuredId
            KeyType: HASH
          - AttributeName: scheduleId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    AppointmentCreatedTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: appointment-created-topic-${sls:stage}

    SqsPEQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs-pe-${sls:stage}

    SqsCLQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs-cl-${sls:stage}

    SubPeSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: { Ref: AppointmentCreatedTopic }
        Protocol: sqs
        Endpoint: !GetAtt SqsPEQueue.Arn
        FilterPolicy:
          countryISO:
            - "PE"

    SubClSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: { Ref: AppointmentCreatedTopic }
        Protocol: sqs
        Endpoint: !GetAtt SqsCLQueue.Arn
        FilterPolicy:
          countryISO:
            - "CL"

    AppointmentBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${env:APPOINTMENT_EVENT_BUS}

    AppointmentConfirmationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: appointment-confirmation-queue-${sls:stage}

    AppointmentToConfirmRule:
      Type: AWS::Events::Rule
      Properties:
        Name: appointment-confirm-rule-${sls:stage}
        EventBusName: !Ref AppointmentBus
        EventPattern:
          source:
            - "appointment.service"
          detail-type:
            - "AppointmentConfirmed"
        Targets:
          - Arn: !GetAtt AppointmentConfirmationQueue.Arn
            Id: ConfirmQueueTarget


plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'
